<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expo ASOINCO 3D</title>
<style>
:root{--scene:#e3e9ef}
html,body{margin:0;height:100%;background:var(--scene);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#viewer{position:absolute;inset:0}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#5a6b7c;font-weight:600}
.viewname{position:absolute;left:10px;top:10px;background:#16324f;color:#fff;font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.hint{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);color:#5a6b7c;font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none}
.ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctrl button{font:inherit;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:8px;border:1px solid #d6dee6;background:rgba(255,255,255,.95);color:#16324f;cursor:pointer;text-align:left}
.ctrl button:disabled{opacity:.45;cursor:default}
.nav3d{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;pointer-events:none}
.fila3d{display:flex;align-items:center;gap:4px;min-width:0;pointer-events:auto;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 6px 18px rgba(22,50,79,.16);padding:4px}
.fila3d > div{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:3px 2px;scroll-behavior:smooth;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.fila3d > div::-webkit-scrollbar{display:none}
.nav3d .flecha{flex:none;width:30px;height:30px;padding:0;border:none;border-radius:50%;background:#16324f;color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(22,50,79,.3);transition:opacity .2s,transform .15s}
.nav3d .flecha:hover{transform:scale(1.08)}
.nav3d .flecha.off{opacity:0;pointer-events:none}
.nav3d button{font:inherit;font-weight:800;border:2px solid transparent;border-radius:8px;cursor:pointer;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.zchip{color:#fff;font-size:13px;padding:6px 10px}
.zchip.on{border-color:#fff;box-shadow:0 0 0 2px #16324f}
.schip{background:rgba(255,255,255,.96);color:#16324f;font-size:12px;padding:5px 8px;min-width:38px}
.schip.sold{background:#e9edf1;color:#8a96a3}
.schip.on{background:#d6392f;color:#fff}
.schips-tit{align-self:center;font-size:11.5px;font-weight:800;color:#fff;background:#16324f;padding:5px 8px;border-radius:8px;flex:none}
#viewer .hint{display:none}
@media (max-width:560px){.hint{display:none}.ctrl button{font-size:11px;padding:5px 8px}}
</style></head><body>

// ---------- texturas de panel ----------
function lighten(hex,a){ const c=parseInt(hex.slice(1),16); let r=c>>16,g=c>>8&255,b=c&255; r=Math.round(r+(255-r)*a); g=Math.round(g+(255-g)*a); b=Math.round(b+(255-b)*a); return `rgb(${r},${g},${b})`; }
function initials(s){ return s.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function drawPanel(ctx,w,h,st,img){
  ctx.fillStyle='#fbfcfd'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle=ZC[st.zona]; ctx.fillRect(0,h-h*0.07,w,h*0.07);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(st.sg){ // logo Buzeta Servicios Generales, mismos colores que Buzeta Consultores
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
    const gr=ctx.createLinearGradient(w*0.12,0,w*0.88,0); gr.addColorStop(0,'#0f8c8c'); gr.addColorStop(0.45,'#050808'); gr.addColorStop(1,'#0f8c8c');
    ctx.fillStyle=gr; ctx.font=`900 ${h*0.2}px Arial`; ctx.fillText('BUZETA',w/2,h*0.36);
    ctx.fillStyle='#0f9ea0'; ctx.font=`700 ${h*0.075}px Arial`;
    if('letterSpacing' in ctx) ctx.letterSpacing=`${w*0.012}px`; ctx.fillText('SERVICIOS GENERALES',w/2,h*0.54,w*0.9); if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    ctx.fillStyle='#111'; ctx.font=`400 ${h*0.05}px Arial`; ctx.fillText('SOLUCIONES INTEGRALES PARA TU EMPRESA',w/2,h*0.66,w*0.9);
    ctx.fillStyle='#0f8c8c'; ctx.fillRect(0,h*0.93,w,h*0.07); return; }
  if(img){
    const s=Math.min(w*0.8/img.width,h*0.7/img.height); const iw=img.width*s, ih=img.height*s;
    ctx.drawImage(img,(w-iw)/2,(h*0.93-ih)/2,iw,ih);
  } else if(st.estado==='logo'){
    const c=ZC[ZONAS[(ZONAS.indexOf(st.zona)+3+st.idx)%8]];
    const r=h*0.2; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(w/2,h*0.36,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`700 ${r*0.95}px Arial`; ctx.fillText(initials(st.empresa),w/2,h*0.37);
    ctx.fillStyle='#1c2b3a'; ctx.font=`700 ${h*0.1}px Arial`; ctx.fillText(st.empresa.toUpperCase(),w/2,h*0.72,w*0.9);
  } else if(st.estado==='nombre'){
    ctx.fillStyle='#1c2b3a'; ctx.font=`700 ${h*0.13}px Arial`; ctx.fillText(st.empresa,w/2,h*0.45,w*0.9);
  } else {
    ctx.strokeStyle='#9aa8b6'; ctx.lineWidth=Math.max(2,w/110); ctx.setLineDash([w/40,w/60]);
    ctx.strokeRect(w*0.18,h*0.16,w*0.64,h*0.6); ctx.setLineDash([]);
    ctx.fillStyle='#6d7d8d'; ctx.font=`600 ${h*0.12}px Arial`; ctx.fillText('Tu logo aquí',w/2,h*0.46,w*0.6);
  }
}
function panelTexture(st,img){
  const c=document.createElement('canvas'); c.width=(img||st.sg)?768:256; c.height=(img||st.sg)?624:208;
  drawPanel(c.getContext('2d'),c.width,c.height,st,img);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function fasciaTexture(st){
  const c=document.createElement('canvas'); c.width=256; c.height=40; const x=c.getContext('2d');
  x.fillStyle=ZC[st.zona]; x.fillRect(0,0,256,40);
  x.fillStyle='#fff'; x.textBaseline='middle'; x.font='700 22px Arial'; x.textAlign='left'; x.fillText(st.code,10,21);
  if(st.empresa){ x.textAlign='right'; x.font='600 15px Arial'; x.fillText(st.empresa,246,21,150); }
  return new THREE.CanvasTexture(c);
}

function lam(c){ return new THREE.MeshLambertMaterial({color:c}); }
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); scene.add(m); return m; }
function rect(w,d,x,z,color,op,y){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({color,transparent:op<1,opacity:op}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y||0.01,z); scene.add(m); return m; }
function floorText(txt,x,z,w,col,rot){ const c=document.createElement('canvas'); c.width=1024; c.height=96; const g=c.getContext('2d');
  g.fillStyle=col; g.font='700 60px Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,512,50,1000);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*96/1024),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
  m.rotation.x=-Math.PI/2; if(rot) m.rotation.z=rot; m.position.set(x,0.04,z); scene.add(m); }
function sign(txt,x,y,z,w,bg){ const c=document.createElement('canvas'); c.width=512; c.height=80; const g=c.getContext('2d');

  addEventListener('resize',act); setTimeout(act,300);
});
